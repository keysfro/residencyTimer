<!doctype html>
<html lang="fa" dir="ltr">
	<head>
		<meta charset="UTF-8" />
		<title>شمارش معکوس ۱۲ شهریور</title>
		<style>
			:root {
				--bg: #03040e;
				--glass: rgba(255, 255, 255, 0.04);
				--accent: #38bdf8;
			}

			body {
				margin: 0;
				height: 100vh;
				display: flex;
				justify-content: center;
				align-items: center;
				background: radial-gradient(circle at 50% 50%, #1e293b 0%, #03040e 80%);
				font-family: 'Segoe UI', Tahoma, sans-serif;
				color: white;
				overflow: hidden;
			}

			/* پس‌زمینه ستاره‌ای/نورانی */
			body::before {
				content: '';
				position: absolute;
				width: 100%;
				height: 100%;
				background-image: radial-gradient(white 1px, transparent 1px);
				background-size: 50px 50px;
				opacity: 0.05;
			}

			.container {
				text-align: center;
				z-index: 1;
			}

			.timer {
				display: flex;
				gap: 20px;
			}
			.group {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 10px;
			}
			.digits-row {
				display: flex;
				gap: 4px;
			}

			.box {
				width: 65px;
				height: 90px;
				background: var(--glass);
				backdrop-filter: blur(10px);
				border: 1px solid rgba(255, 255, 255, 0.1);
				border-radius: 14px;
				position: relative;
				overflow: hidden;
				display: flex;
				justify-content: center;
				align-items: center;
				font-size: 2.8rem;
				font-weight: 800;
				color: var(--accent);
				box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
			}

			.digit-wrap {
				position: relative;
				width: 100%;
				height: 100%;
			}
			.digit {
				position: absolute;
				width: 100%;
				height: 100%;
				display: flex;
				align-items: center;
				justify-content: center;
			}

			.label {
				font-size: 0.7rem;
				color: #94a3b8;
				text-transform: uppercase;
				letter-spacing: 2px;
			}

			.in {
				animation: slideIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
			}
			.out {
				animation: slideOut 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
			}

			@keyframes slideIn {
				from {
					transform: translateY(-100%);
					opacity: 0;
				}
				to {
					transform: translateY(0);
					opacity: 1;
				}
			}
			@keyframes slideOut {
				from {
					transform: translateY(0);
					opacity: 1;
				}
				to {
					transform: translateY(100%);
					opacity: 0;
				}
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div style="margin-bottom: 40px; font-weight: 300; letter-spacing: 3px">
				شمارش معکوس تا ۹ اردیبهشت ۱۴۰۶
			</div>
			<div class="timer">
				<div class="group">
					<div class="digits-row" id="days"></div>
					<div class="label">روز</div>
				</div>
				<div class="group">
					<div class="digits-row" id="hours"></div>
					<div class="label">ساعت</div>
				</div>
				<div class="group">
					<div class="digits-row" id="minutes"></div>
					<div class="label">دقیقه</div>
				</div>
				<div class="group">
					<div class="digits-row" id="seconds"></div>
					<div class="label">ثانیه</div>
				</div>
			</div>
		</div>

		<script>
			// تنظیم دقیق تاریخ: 12 شهریور (ماه 8)
			const targetDate = new Date('2027-04-29T00:00:00');
			g;
			function createDigitBox(id) {
				return `<div class="box"><div class="digit-wrap" id="${id}-wrap"><div class="digit" id="${id}">0</div></div></div>`;
			}

			['days', 'hours', 'minutes', 'seconds'].forEach((type) => {
				document.getElementById(type).innerHTML =
					createDigitBox(type + '-tens') + createDigitBox(type + '-ones');
			});

			function updateDigit(id, newValue) {
				const el = document.getElementById(id);
				if (el && el.textContent !== newValue) {
					const wrap = el.parentElement;
					const next = document.createElement('div');
					next.className = 'digit in';
					next.id = id;
					next.textContent = newValue;

					el.className = 'digit out';
					el.removeAttribute('id');
					wrap.appendChild(next);
					setTimeout(() => el.remove(), 500);
				}
			}

			function tick() {
				// محاسبه تفاوت زمانی دقیق
				const now = new Date();
				let diff = Math.floor((targetDate - now) / 1000);

				// اگر تاریخ گذشته، برای سال بعد حساب کند
				if (diff < 0) diff = 0;

				const d = Math.floor(diff / 86400);

				const h = Math.floor((diff % 86400) / 3600);
				const m = Math.floor((diff % 3600) / 60);
				const s = diff % 60;

				const time = {
					days: String(d).padStart(3, '0').slice(-2), // نمایش دو رقمی روز
					hours: String(h).padStart(2, '0'),
					minutes: String(m).padStart(2, '0'),
					seconds: String(s).padStart(2, '0'),
				};

				// هندل کردن نمایش صحیح صدگان در صورت نیاز (اگر بیشتر از 99 روز بود)
				const dTens = d >= 100 ? Math.floor(d / 100).toString() : String(d).padStart(2, '0')[0];
				const dOnes = String(d).slice(-1);

				updateDigit('days-tens', d >= 10 ? String(Math.floor(d / 10)).slice(-1) : '0');
				updateDigit('days-ones', String(d % 10));
				updateDigit('hours-tens', time.hours[0]);
				updateDigit('hours-ones', time.hours[1]);
				updateDigit('minutes-tens', time.minutes[0]);
				updateDigit('minutes-ones', time.minutes[1]);
				updateDigit('seconds-tens', time.seconds[0]);
				updateDigit('seconds-ones', time.seconds[1]);
			}

			setInterval(tick, 1000);
			tick();
		</script>
	</body>
</html>
